# Builds the Android app on every push and pull request.
#
# Always: a debug APK you can install directly on a phone.
# When signing secrets are set: a signed release AAB (for Google Play) and APK.
#
# Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    your upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to players, e.g. 1.0.1 (blank = package.json version)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # translations: same keys, placeholders, tags and plural forms in every language
      - name: Test
        run: npm test

      # strict type-check, then the Vite production build into dist/
      - name: Type-check and build the game
        run: npm run build

      - name: Copy the game into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # versionCode must increase with every upload to Play, so it follows the run number
      - name: Set version
        run: |
          NAME="${{ github.event.inputs.version_name }}"
          [ -z "$NAME" ] && NAME=$(node -p "require('./package.json').version")
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "Building $NAME (code $((100 + GITHUB_RUN_NUMBER)))"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # fail the build if the APK is missing the game or has the wrong settings
      - name: Check the APK
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          unzip -l "$APK" | grep -q "assets/public/index.html" || { echo "::error title=APK check::The game is missing from the APK"; exit 1; }
          unzip -p "$APK" assets/public/index.html | grep -q "Cube Climb" || { echo "::error title=APK check::Bundled index.html is not the game"; exit 1; }
          PKG=$("$AAPT" dump badging "$APK" | grep -o "package: name='[^']*' versionCode='[^']*' versionName='[^']*'")
          SDK=$("$AAPT" dump badging "$APK" | grep -o "targetSdkVersion:'[^']*'")
          ORIENT=$("$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -o "screenOrientation(0x[0-9a-f]*)=(type 0x10)0x[0-9a-f]*" | head -1)
          case "$ORIENT" in *0x1) ORIENT=portrait;; *) ORIENT="NOT portrait ($ORIENT)";; esac
          # the Google Mobile Ads SDK crashes the app at launch without its app id
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q "com.google.android.gms.ads.APPLICATION_ID" \
            || { echo "::error title=APK check::AdMob APPLICATION_ID is missing from the manifest"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/assets/index-.*\.js" || { echo "::error title=APK check::The game bundle is missing from the APK"; exit 1; }
          ADS=$(unzip -p "$APK" 'assets/public/assets/*.js' | grep -o 'rewardedId: *"[^"]*"' | grep -o 'ca-app-pub-[^"]*')
          case "$ADS" in ca-app-pub-3940256099942544/*) ADS="TEST ads";; *) ADS="real ad unit $ADS";; esac
          echo "::notice title=APK check::$PKG $SDK, $ORIENT, game bundled, $ADS, $(du -h "$APK" | cut -f1)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: cube-climb-debug-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Decode upload keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build signed release AAB and APK
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload release builds
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: cube-climb-release-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
